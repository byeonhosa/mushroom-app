# Dependency update pull requests (SEC-4).
#
# Alerts and security updates are switched on in the repository settings
# (owner action O1 in docs/ROADMAP.md). This file adds scheduled version
# updates, grouped so that a week's worth arrives as one pull request per
# ecosystem and runs through CI like any other change.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      backend:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
      - /ops/backup
      - /ops/proxy
    schedule:
      interval: weekly
      day: monday
    groups:
      docker:
        patterns: ["*"]
    # Runtime versions are changed on purpose, never by a weekly bump
    # (docs/DECISIONS.md D-025):
    # - a new PostgreSQL major version cannot read the existing data volume;
    # - Python and Node must move together with CI and the lockfiles.
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "caddy"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      compose:
        patterns: ["*"]
    ignore:
      # See the docker entry above: a major version needs a dump and restore.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
