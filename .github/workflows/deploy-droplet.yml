name: Deploy to droplet

# Only triggers on push to main (which forks cannot do).
# This is the security mitigation for running a self-hosted runner on a public repo:
# fork PRs cannot trigger this workflow because they cannot push to main.
# PR validation continues to run on GitHub-hosted runners in ci.yml.
#
# The droplet has no SSH access at present, so this workflow is the only way to
# change it. Everything the server needs is expressed here or in
# docker-compose.yml. Two rules that must never be broken:
#   - never remove the pgdata volume (no `down -v`, no `volume rm`, no
#     `system prune --volumes`);
#   - never print the contents of /opt/mushroom-app/.env.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Don't run multiple deploys concurrently. If a newer push arrives mid-deploy,
# wait for the in-flight one to finish rather than cancelling it.
concurrency:
  group: deploy-droplet
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, mushroom-app-prod]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: /opt/mushroom-app

    steps:
      - name: Pull latest main
        run: |
          git fetch origin
          git checkout main
          git reset --hard origin/main
          git log --oneline -3

      - name: Host state before deploy
        run: |
          echo "uptime: $(uptime -p)"
          df -h / | tail -n 1
          free -m | sed -n '1,2p'
          docker --version
          docker compose version

      - name: Update non-secret settings in .env
        run: |
          # Database dumps live outside the repository checkout so that no git
          # operation can touch them.
          bash ops/deploy/set-env.sh .env BACKUP_DIR /var/backups/mushroom-app

      - name: Back up the database before changing anything
        run: |
          docker compose build backup
          docker compose up -d --wait db
          docker compose run --rm --no-deps backup once predeploy

      - name: Rebuild and start containers
        run: |
          docker compose up -d --build --remove-orphans
          docker compose ps

      - name: Wait for API to respond
        run: |
          for i in $(seq 1 24); do
            if curl -fsS -m 5 http://127.0.0.1:8000/api/health/ready > /dev/null 2>&1; then
              echo "API responding after $((i * 5))s"
              break
            fi
            echo "Waiting for API... ($i/24)"
            sleep 5
          done
          # Final assert — fails the step if the API still isn't responding
          curl -fsS http://127.0.0.1:8000/api/health/ready > /dev/null

      - name: Wait for frontend to respond
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -m 5 http://127.0.0.1:3000/ > /dev/null 2>&1; then
              echo "Frontend responding after $((i * 5))s"
              break
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 5
          done
          # Final assert — fails the step if the frontend still isn't responding
          curl -fsS http://127.0.0.1:3000/ > /dev/null

      - name: First administrator (only when no user exists)
        env:
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
        run: |
          # USR-3. The two secrets go to a container that exists only for this
          # command; the long-running API container never holds them. Once any
          # user exists the command does nothing, so it is safe on every
          # deploy. Without the secrets it says so and nobody can sign in.
          docker compose run --rm --no-deps \
            -e BOOTSTRAP_ADMIN_EMAIL -e BOOTSTRAP_ADMIN_PASSWORD \
            api python -m app.manage bootstrap-admin

      - name: Smoke test endpoints
        run: |
          set -e
          echo "=== health answers without a session ==="
          curl -fsS http://127.0.0.1:8000/api/health/ready | python3 -m json.tool
          echo ""
          echo "=== everything else refuses without a session (USR-1) ==="
          for path in /api/bags /api/species /api/dashboard/overview /api/reports/production /api/users; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000$path")
            echo "$path -> $code"
            test "$code" = "401"
          done
          echo ""
          echo "=== frontend ==="
          curl -fsS -o /dev/null -w "sign-in page: HTTP %{http_code}\n" http://127.0.0.1:3000/login

      - name: Signed-in request
        run: |
          set -e
          # A two-minute session for the first administrator, made on the
          # server, so this check never depends on anyone's password.
          if token=$(docker compose exec -T api python -m app.manage smoke-session); then
            echo "::add-mask::$token"
            cookie="Cookie: mfa_session=$token"
            # Through the frontend's /api forwarder, as a browser on the server would.
            curl -fsS -H "$cookie" http://127.0.0.1:3000/api/auth/me \
              | python3 -c "import json,sys; u=json.load(sys.stdin); print('signed in as role:', u['role'])"
            curl -fsS -H "$cookie" http://127.0.0.1:3000/api/dashboard/overview \
              | python3 -c "import json,sys; print(json.dumps(json.load(sys.stdin)['summary'], indent=2))"
            curl -fsS -H "$cookie" http://127.0.0.1:3000/api/species \
              | python3 -c "import json,sys; print(len(json.load(sys.stdin)), 'active species')"
            curl -fsS -o /dev/null -X POST -H "$cookie" -H "Origin: http://127.0.0.1:3000" \
              http://127.0.0.1:3000/api/auth/logout
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "$cookie" http://127.0.0.1:3000/api/auth/me)
            echo "after sign-out -> $code"
            test "$code" = "401"
          else
            echo "::warning::No administrator account exists, so nobody can sign in. Set the repository secrets BOOTSTRAP_ADMIN_EMAIL and BOOTSTRAP_ADMIN_PASSWORD (roadmap, owner action O2) and re-run this workflow."
          fi

      - name: Row counts (is there real data yet?)
        run: |
          # Counts only. The lead developer brief treats the database as empty,
          # and free to migrate, until these are above zero.
          docker compose exec -T db sh -c 'for t in bags harvest_events; do echo "$t=$(psql -X -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT count(*) FROM $t")"; done'

      - name: Backup status and restore test
        run: |
          # The daily loop writes its first dump on start; give it a moment.
          for i in $(seq 1 12); do
            if docker compose exec -T backup backup status > /dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          docker compose exec -T backup backup status
          # REL-3: restore the newest dump into a scratch database on every deploy.
          docker compose exec -T backup backup verify

      - name: Restart policies and published ports
        run: |
          for c in $(docker compose ps -q); do
            docker inspect --format '{{.Name}} restart={{.HostConfig.RestartPolicy.Name}} log-max-size={{index .HostConfig.LogConfig.Config "max-size"}}' "$c"
          done
          docker compose ps --format 'table {{.Service}}\t{{.Status}}\t{{.Ports}}'

      - name: Prune old images and build cache
        run: |
          # Dangling images are the ones this deploy replaced. Build cache
          # unused for three days goes too. Volumes are never pruned.
          docker image prune -f | tail -n 1
          docker builder prune -f --filter "until=72h" | tail -n 1
          docker system df
          df -h / | tail -n 1

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== docker compose ps ==="
          docker compose ps -a
          echo ""
          echo "=== api logs (tail 100) ==="
          docker compose logs --tail 100 api || true
          echo ""
          echo "=== frontend logs (tail 50) ==="
          docker compose logs --tail 50 frontend || true
          echo ""
          echo "=== backup logs (tail 50) ==="
          docker compose logs --tail 50 backup || true
          echo ""
          echo "=== db logs (tail 30) ==="
          docker compose logs --tail 30 db || true
