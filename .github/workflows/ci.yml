name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH:
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        run: |
          python -m pip install -U pip
          pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  migration-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mushroom_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mushroom_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/mushroom_ci
      PYTHONPATH:
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        run: |
          python -m pip install -U pip
          pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Run migration smoke test
        run: pytest -q tests/test_migrations.py

      - name: Run concurrency tests against PostgreSQL
        # BAG-11: simultaneous sessions. SQLite cannot show these.
        run: pytest -q tests/test_postgres_concurrency.py

  api-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install -U pip
          pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check generated API contract
        working-directory: frontend
        run: npm run check:api-contract

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

  dependency-audit:
    # SEC-4: no release ships with a known high or critical advisory.
    # An accepted exception is recorded in docs/DECISIONS.md and passed here
    # with --ignore-vuln so that it stays visible.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: |
          python -m pip install -U pip
          pip install "pip-audit>=2.9,<3"

      - name: Audit backend lockfile
        working-directory: backend
        run: pip-audit --require-hashes --disable-pip -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  compose-stack:
    # Builds the images exactly as the droplet does and runs the whole stack,
    # so a broken Dockerfile or Compose file is caught here and not in
    # production. Also proves that a backup can be restored (REL-3).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build
          docker compose ps

      - name: Wait for the API and the frontend
        run: |
          for i in $(seq 1 36); do
            if curl -fsS -m 5 http://127.0.0.1:8000/api/health/ready > /dev/null 2>&1 \
              && curl -fsS -m 5 -o /dev/null http://127.0.0.1:3000/ 2> /dev/null; then
              echo "stack responding after $((i * 5))s"
              break
            fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:8000/api/health/ready
          curl -fsS -o /dev/null -w "frontend: HTTP %{http_code}\n" http://127.0.0.1:3000/

      - name: Restart policy, log rotation, loopback-only ports
        run: bash ops/ci/check-hardening.sh

      - name: Containers do not run as root
        run: |
          test "$(docker compose exec -T api id -u)" != "0"
          test "$(docker compose exec -T frontend id -u)" != "0"

      - name: Backup, status and restore test
        run: |
          docker compose exec -T backup backup once predeploy
          for i in $(seq 1 12); do
            if docker compose exec -T backup backup status > /dev/null 2>&1; then break; fi
            sleep 5
          done
          docker compose exec -T backup backup status
          docker compose exec -T -e VERIFY_STRICT=1 backup backup verify
          sudo find backups -type f | sort

      - name: Stack survives a restart of the Docker daemon
        run: |
          sudo systemctl restart docker
          for i in $(seq 1 36); do
            if curl -fsS -m 5 http://127.0.0.1:8000/api/health/ready > /dev/null 2>&1 \
              && curl -fsS -m 5 -o /dev/null http://127.0.0.1:3000/ 2> /dev/null; then
              echo "stack back after $((i * 5))s"
              break
            fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:8000/api/health/ready > /dev/null
          curl -fsS -o /dev/null http://127.0.0.1:3000/
          docker compose ps

      - name: Logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail 80

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-tests, frontend-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install -U pip
          pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        timeout-minutes: 8
        # --with-deps installs system packages with apt, and the runner's
        # package mirrors fail now and then. Try twice, then fall back to the
        # browser alone: the runner image already carries Chrome's libraries.
        run: |
          timeout 150 npx playwright install --with-deps chromium \
            || (sleep 15 && timeout 150 npx playwright install --with-deps chromium) \
            || npx playwright install chromium

      - name: Run browser workflow tests
        working-directory: frontend
        run: npm run test:e2e
