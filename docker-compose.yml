# Production and local stack. On the droplet this file is the whole server
# configuration: the deploy workflow runs `docker compose up -d --build`.
#
# - Every service restarts by itself after a crash or a reboot (REL-1).
# - The proxy is the only service published to the outside, on ports 80 and
#   443. The database, the API and the frontend are published on the loopback
#   interface only (SEC-2).
# - Container logs are rotated so they cannot fill the disk.
# - The pgdata volume holds the database. Never remove it.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mushroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mushroom}
      POSTGRES_DB: ${POSTGRES_DB:-mushroom}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mushroom} -d ${POSTGRES_DB:-mushroom}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mushroom}:${POSTGRES_PASSWORD:-mushroom}@db:5432/${POSTGRES_DB:-mushroom}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      APP_ENV: ${APP_ENV:-development}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      # The public hostname, once there is one (roadmap, owner action O3).
      APP_HOSTNAME: ${APP_HOSTNAME:-}
      # First administrator, created when no user exists. On the droplet these
      # stay empty here: the deploy workflow passes the GitHub secrets to a
      # one-off `app.manage bootstrap-admin` container instead, so the password
      # is never part of this long-running container. For a local stack, set
      # them in .env.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=5)"
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Where the frontend forwards /api/* when no proxy is in front of it.
        API_PROXY_TARGET: http://api:8000
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1));"
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  # The way in from outside: one origin for the frontend and /api, with HTTPS
  # as soon as APP_HOSTNAME names a host whose DNS points here (ops/proxy/).
  proxy:
    build:
      context: .
      dockerfile: ops/proxy/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      # The hostname when there is one, otherwise plain HTTP on port 80.
      APP_SITE_ADDRESS: ${APP_HOSTNAME:-:80}
      APP_TLS_DIRECTIVE: ${APP_TLS_DIRECTIVE:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Certificates and their renewal state. Losing this volume only costs a
      # new certificate, but repeated loss runs into the issuer's rate limits.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Daily pg_dump into a host directory, 14 copies kept (REL-2). See
  # ops/backup/backup.sh. BACKUP_DIR is set on the droplet to a path outside
  # the repository checkout; locally it defaults to ./backups (gitignored).
  backup:
    build:
      context: .
      dockerfile: ops/backup/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-mushroom}
      PGPASSWORD: ${POSTGRES_PASSWORD:-mushroom}
      PGDATABASE: ${POSTGRES_DB:-mushroom}
      BACKUP_DAILY_KEEP: ${BACKUP_DAILY_KEEP:-14}
      BACKUP_PREDEPLOY_KEEP: ${BACKUP_PREDEPLOY_KEEP:-5}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/backup", "status"]
      interval: 5m
      timeout: 20s
      retries: 2
      start_period: 2m

volumes:
  pgdata:
  caddy_data:
  caddy_config:
